<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mrs. Tara Datla Residence · Rambhapur · 3D Walkthrough</title>
<style>
:root{--bg:#e9eef2;--panel:rgba(255,255,255,.93);--text:#1d232a;--muted:#5f6973;--line:#d3dae1;--on:#2f6fb3;--hover:rgba(0,0,0,.06)}
body.dark{--bg:#14181d;--panel:rgba(27,32,39,.93);--text:#e7ecf1;--muted:#9aa6b2;--line:#323b46;--on:#3f7fc7;--hover:rgba(255,255,255,.07)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
canvas{display:block;touch-action:none}
#bar{position:fixed;top:8px;left:8px;right:8px;display:flex;flex-wrap:wrap;gap:6px;z-index:6;pointer-events:none}
.grp{pointer-events:auto;display:flex;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;backdrop-filter:blur(8px);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.grp button,.grp select{border:0;background:transparent;color:var(--text);padding:6px 10px;border-radius:7px;font:inherit;cursor:pointer;white-space:nowrap}
.grp button:hover{background:var(--hover)}
.grp button.on{background:var(--on);color:#fff}
.grp select{background:var(--hover)}
.grp label{padding:0 4px 0 8px;color:var(--muted)}
.title{padding:4px 12px;flex-direction:column;align-items:flex-start;gap:0}
.title b{font-size:14px}.title span{color:var(--muted);font-size:11px}
#panel{position:fixed;right:8px;top:62px;bottom:8px;width:330px;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(8px);display:flex;flex-direction:column;overflow:hidden}
#panel.hide{display:none}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;color:var(--muted);padding:10px;font:600 13px system-ui,sans-serif;cursor:pointer;border-bottom:2px solid transparent}
.tabs button.on{color:var(--text);border-color:var(--on)}
.tab{overflow:auto;padding:8px 10px 14px;flex:1}
.tab h4{margin:12px 2px 6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.ri{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;color:var(--text);padding:7px 8px;border-radius:8px;cursor:pointer;font:inherit}
.ri:hover{background:var(--hover)}.ri small{margin-left:auto;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.dot.good,.bdg.good{background:#2e9d58}.dot.okay,.bdg.okay{background:#e0a21b}.dot.review,.bdg.review{background:#d64545}
.note{color:var(--muted);font-size:12px;margin:12px 4px 0}
.vsum{padding:9px;border:1px solid var(--line);border-radius:10px;margin:4px 0 8px}
.vsum .bdg{margin-right:4px}
.vi{padding:8px 4px;border-bottom:1px solid var(--line)}
.vh{display:flex;align-items:center;gap:8px}
.vh small{margin-left:auto;color:var(--muted);text-align:right}
.bdg{color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;text-transform:uppercase;letter-spacing:.04em}
.vi p{margin:5px 0 0;color:var(--muted)}.vi em{color:var(--text);font-style:normal}
#legend{position:fixed;left:8px;bottom:8px;z-index:4;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px}
#legend div{display:flex;align-items:center;gap:7px;margin:2px 0}
#legend i{width:16px;height:10px;border-radius:2px;border:1px solid rgba(0,0,0,.3)}
#compass{position:fixed;left:10px;top:70px;z-index:4;width:66px;height:66px;background:var(--panel);border:1px solid var(--line);border-radius:50%}
#compass small{position:absolute;bottom:-18px;left:0;right:0;text-align:center;color:var(--muted);font-size:11px}
#needle{width:100%;height:100%}
#pad{position:fixed;right:14px;bottom:14px;z-index:7;display:grid;grid-template-columns:repeat(3,58px);gap:8px;user-select:none;-webkit-user-select:none}
#pad button{height:58px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:22px;touch-action:none;cursor:pointer}
#pad button.act{background:var(--on);color:#fff}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;z-index:4;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:12px;color:var(--muted)}
[hidden]{display:none!important}
@media (max-width:760px){
 #panel{left:8px;right:8px;width:auto;top:auto!important;max-height:48vh}
 .title span{display:none}
 #legend{font-size:11px;padding:6px 8px}
 #hint{display:none}
 #pad{grid-template-columns:repeat(3,52px)}#pad button{height:52px}
}
</style>
</head>
<body>
<div id="app"></div>

<div id="bar">
  <div class="grp title"><b>Mrs. Tara Datla Residence</b><span>Rambhapur · AR_27/2026 · Aakar Architects</span></div>
  <div class="grp" id="gMode"><button data-mode="orbit" class="on">3D</button><button data-mode="top">Top</button><button data-mode="walk">Walk</button></div>
  <div class="grp" id="gFloor"><button data-f="0" class="on">Ground</button><button data-f="1">1st</button><button data-f="2">Roof</button></div>
  <div class="grp"><button id="tLab" class="on">Labels</button><button id="tFurn" class="on">Furniture</button><button id="tVas">Vastu grid</button></div>
  <div class="grp"><label for="face">Road faces</label>
    <select id="face"><option>N</option><option>NE</option><option selected>E</option><option>SE</option><option>S</option><option>SW</option><option>W</option><option>NW</option></select></div>
  <div class="grp"><button id="tTheme" title="Light / dark">◐</button><button id="tPanel" class="on" title="Rooms & Vastu">☰</button></div>
</div>

<aside id="panel">
  <div class="tabs"><button data-tab="rooms" class="on">Rooms</button><button data-tab="vastu">Vastu check</button></div>
  <div class="tab" id="tabRooms"></div>
  <div class="tab" id="tabVastu" hidden></div>
</aside>

<div id="compass"><svg id="needle" viewBox="0 0 60 60">
  <path d="M30 5 L36 30 L30 27 L24 30Z" fill="#e53935"/><path d="M30 55 L36 30 L30 33 L24 30Z" fill="#9aa5b1"/>
  <text x="30" y="16" font-size="9" font-weight="700" text-anchor="middle" fill="#fff">N</text></svg><small id="roadTxt">Road: E</small></div>

<div id="legend" title="Existing / new split is an assumption – edit wall types in the code">
  <div><i style="background:#c49a6c"></i>Existing walls</div>
  <div><i style="background:#f4f1ea"></i>New walls</div>
  <div><i style="background:#8fa3b8"></i>First floor (concept)</div>
  <div><i style="background:#e8873a"></i>Connection (stairs)</div>
</div>

<div id="pad" hidden>
  <button data-k="tl">↺</button><button data-k="fwd">▲</button><button data-k="tr">↻</button>
  <button data-k="sl">◀</button><button data-k="back">▼</button><button data-k="sr">▶</button>
</div>
<div id="hint" hidden>Drag to look · W/S or ↑/↓ move · A/D sidestep · ←/→ or Q/E turn · Shift = run · walk onto the stairs to change floor</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============ BASICS (plan units in feet; x = left→right, z = house front(0)→back(70); front setback is negative z) ============ */
const $ = s => document.querySelector(s);
const LH = 10, WH = 9.5, T = 0.75;
const W3 = (x, y, z) => new THREE.Vector3(x - 17, y, 35 - z);
const FLOORS = ['Ground floor', '1st floor', 'Roof'];
const ORBIT_HOME = { p: [52, 56, 118], t: [0, 6, 14] };

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
$('#app').appendChild(renderer.domElement);
const scene = new THREE.Scene();

const persp = new THREE.PerspectiveCamera(55, 1, 0.1, 3000);
persp.position.set(...ORBIT_HOME.p);
const ortho = new THREE.OrthographicCamera(-50, 50, 50, -50, 0.1, 1000);
ortho.position.set(0, 300, 8.01);
let camera = persp;

const orbit = new OrbitControls(persp, renderer.domElement);
orbit.target.set(...ORBIT_HOME.t); orbit.enableDamping = true; orbit.maxPolarAngle = Math.PI * 0.49;
orbit.minDistance = 6; orbit.maxDistance = 340;
const topCtl = new OrbitControls(ortho, renderer.domElement);
topCtl.target.set(0, 0, 8);
topCtl.enableRotate = false; topCtl.screenSpacePanning = true; topCtl.enableDamping = true;
topCtl.mouseButtons = { LEFT: THREE.MOUSE.PAN, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN };
topCtl.touches = { ONE: THREE.TOUCH.PAN, TWO: THREE.TOUCH.DOLLY_PAN };
topCtl.minZoom = 0.5; topCtl.maxZoom = 8; topCtl.enabled = false;

const hemi = new THREE.HemisphereLight(0xffffff, 0x8c7b66, 1.1); scene.add(hemi);
scene.add(new THREE.AmbientLight(0xffffff, 0.25));
const sun = new THREE.DirectionalLight(0xfff4e0, 2.2);
sun.position.set(-45, 90, 70); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -70, right: 70, top: 70, bottom: -70, near: 1, far: 320 });
sun.shadow.camera.updateProjectionMatrix(); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.04;
scene.add(sun);

const groundMat = new THREE.MeshStandardMaterial({ color: 0xa9bb92, roughness: 1 });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(800, 800), groundMat);
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.06; ground.receiveShadow = true; scene.add(ground);

/* ============ HELPERS ============ */
const _m = {};
function M(c, o) { const k = c + (o ? JSON.stringify(o) : ''); return _m[k] || (_m[k] = new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: .85 }, o || {}))); }
const WALL = { existing: M(0xc49a6c), new: M(0xf4f1ea), ff: M(0x8fa3b8), conn: M(0xe8873a), site: M(0x8a8178) };
const FRAME = M(0x3b4046, { roughness: .6 }), WOOD = M(0xa0703f, { roughness: .7 }), DECK = M(0xa77d55);
const GLASS = new THREE.MeshStandardMaterial({ color: 0x8ec5e0, transparent: true, opacity: .32, roughness: .08, metalness: .1 });
const unitBox = new THREE.BoxGeometry(1, 1, 1);
const solids = [];

const siteG = new THREE.Group(); scene.add(siteG);
const levels = [0, 1, 2].map(() => new THREE.Group());
const furn = [0, 1, 2].map(() => new THREE.Group());
const labels = [0, 1, 2].map(() => new THREE.Group());
levels.forEach((g, i) => { scene.add(g); g.add(furn[i]); g.add(labels[i]); });

function box(x1, x2, z1, z2, y1, y2, mat, grp, solid = false, cast = true) {
  if (x1 > x2) [x1, x2] = [x2, x1]; if (z1 > z2) [z1, z2] = [z2, z1];
  const m = new THREE.Mesh(unitBox, mat);
  m.scale.set(x2 - x1, y2 - y1, z2 - z1);
  m.position.copy(W3((x1 + x2) / 2, (y1 + y2) / 2, (z1 + z2) / 2));
  m.castShadow = cast; m.receiveShadow = true; grp.add(m);
  if (solid) solids.push({ x1, x2, z1, z2, y1, y2 });
  return m;
}
// wall(x1,z1,x2,z2, level, type, openings[[from,to,'d'|'w'|'h']], {h,t})
function wall(a, b, c, d, lvl, type, ops = [], o = {}) {
  const base = lvl * LH, h = o.h ?? WH, t = o.t ?? T, m = WALL[type], g = levels[lvl];
  const hz = Math.abs(b - d) < 1e-6, fixed = hz ? b : a;
  const s0 = (hz ? Math.min(a, c) : Math.min(b, d)) - t / 2, s1 = (hz ? Math.max(a, c) : Math.max(b, d)) + t / 2;
  const seg = (u0, u1, y0, y1) => { if (u1 - u0 < .02 || y1 - y0 < .02) return;
    hz ? box(u0, u1, fixed - t / 2, fixed + t / 2, base + y0, base + y1, m, g, true)
       : box(fixed - t / 2, fixed + t / 2, u0, u1, base + y0, base + y1, m, g, true); };
  let cur = s0;
  for (const [p0, p1, k] of [...ops].sort((p, q) => p[0] - q[0])) {
    seg(cur, p0, 0, h);
    const [lo, hi] = k === 'd' ? [0, 7] : k === 'h' ? [6, 8] : [3, 7];
    seg(p0, p1, 0, lo); seg(p0, p1, hi, h);
    if (k !== 'd' && hi <= h) hz ? box(p0, p1, fixed - .05, fixed + .05, base + lo, base + hi, GLASS, g, false, false)
                                 : box(fixed - .05, fixed + .05, p0, p1, base + lo, base + hi, GLASS, g, false, false);
    cur = p1;
  }
  seg(cur, s1, 0, h);
}
// glass railing with charcoal top rail
function rail(a, b, c, d, lvl, h = 3.4) {
  const base = lvl * LH, g = levels[lvl], hz = Math.abs(b - d) < 1e-6;
  if (hz) { const x1 = Math.min(a, c), x2 = Math.max(a, c);
    box(x1, x2, b - .05, b + .05, base, base + h, GLASS, g, true, false); box(x1, x2, b - .12, b + .12, base + h, base + h + .18, FRAME, g); }
  else { const z1 = Math.min(b, d), z2 = Math.max(b, d);
    box(a - .05, a + .05, z1, z2, base, base + h, GLASS, g, true, false); box(a - .12, a + .12, z1, z2, base + h, base + h + .18, FRAME, g); }
}
function fit(g, t, w, px) { do { g.font = `${w} ${px}px system-ui,"Segoe UI",Roboto,sans-serif`; px -= 2; } while (g.measureText(t).width > 480 && px > 14); }
function makeLabel(t, s, accent) {
  const c = document.createElement('canvas'), g = c.getContext('2d'); c.width = 512; c.height = s ? 168 : 100;
  g.fillStyle = 'rgba(255,255,255,.9)'; g.beginPath();
  g.roundRect ? g.roundRect(4, 4, 504, c.height - 8, 24) : g.rect(4, 4, 504, c.height - 8); g.fill();
  g.lineWidth = accent ? 8 : 3; g.strokeStyle = accent ? '#' + accent.toString(16).padStart(6, '0') : 'rgba(0,0,0,.18)'; g.stroke();
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#1d232a';
  fit(g, t, 700, 56); g.fillText(t, 256, s ? 58 : 52);
  if (s) { g.fillStyle = '#55606b'; fit(g, s, 500, 40); g.fillText(s, 256, 120); }
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true }));
  sp.scale.set(6.5, 6.5 * c.height / 512, 1); sp.renderOrder = 20; return sp;
}

/* ============ SITE: road, 16' front setback with garden, otla, parking ============ */
const STONE = M(0xcfc6b5), PAVER = M(0xa3a29c), LAWN = M(0x79a957), FOOT = M(0xbdb8ae), LEAF = M(0x4f8a3e), LEAF2 = M(0x5f9e48);
box(-80, 114, -44, -17, -0.06, -0.03, M(0x4b4f55), siteG, false, false);                 // road
for (let x = -76; x < 110; x += 9) box(x, x + 4.5, -30.7, -30.3, -0.03, -0.02, M(0xf2f2f2), siteG, false, false);
box(-80, 114, -17, -16, -0.06, 0.04, FOOT, siteG, false, false);                           // footpath
box(0, 17.8, -6, 0, -0.06, 0.03, STONE, siteG, false, false);                               // otla (old house)
box(0, 17.8, -16, -6, -0.06, 0.0, LAWN, siteG, false, false);                               // lawn
box(12.6, 15.8, -16, -6, -0.06, 0.035, STONE, siteG, false, false);                         // garden path
box(17.8, 22.4, -16, 0, -0.06, 0.035, STONE, siteG, false, false);                          // walkway to main entry
box(22.4, 34, -16, 0, -0.06, 0.03, PAVER, siteG, false, false);                             // driveway / parking
for (let z = -15; z < 0; z += 3) box(22.4, 34, z, z + 0.08, 0.03, 0.04, M(0x8d8c86), siteG, false, false);
const roadLbl = makeLabel('MAIN ROAD'); roadLbl.material.depthTest = true; roadLbl.position.copy(W3(17, 1.5, -24)); siteG.add(roadLbl);
// compound wall with three gates
const SG = levels[0];
wall(0.3, -16, 33.7, -16, 0, 'site', [[12.6, 15.8, 'd'], [18.6, 22.2, 'd'], [22.6, 33.2, 'd']], { h: 3.5, t: .6 });
wall(0.3, -16, 0.3, 0, 0, 'site', [], { h: 3.5, t: .6 });
wall(33.7, -16, 33.7, 0, 0, 'site', [], { h: 3.5, t: .6 });
[12, 16.4, 18, 22.4, 33.7].forEach(x => { box(x - .6, x + .6, -16.6, -15.4, 0, 5, FRAME, SG, true); box(x - .35, x + .35, -16.35, -15.65, 5, 5.4, M(0xfff3c4, { emissive: 0x6b5a20 }), SG); });
box(0.6, 11.6, -15.4, -14.6, 0, 2.4, LEAF, siteG);                                           // hedge
box(0.6, 1.4, -14.6, -6.4, 0, 2.4, LEAF, siteG);
box(2, 7, -4.4, -3.2, 0, 1.5, WOOD, siteG);                                                  // otla bench
function tree(x, z, s = 1) {
  const tr = new THREE.Mesh(new THREE.CylinderGeometry(.35 * s, .45 * s, 7 * s, 10), M(0x6b4a2b)); tr.position.copy(W3(x, 3.5 * s, z)); tr.castShadow = true; siteG.add(tr);
  [[0, 8.5, 0, 3.2], [1.4, 7.4, .8, 2.4], [-1.3, 7.6, -.6, 2.3]].forEach(([dx, y, dz, r]) => {
    const f = new THREE.Mesh(new THREE.SphereGeometry(r * s, 18, 14), y > 8 ? LEAF2 : LEAF); f.position.copy(W3(x + dx, y * s, z + dz)); f.castShadow = true; siteG.add(f); });
  solids.push({ x1: x - .5, x2: x + .5, z1: z - .5, z2: z + .5, y1: 0, y2: 7 * s });
}
tree(4, -10.5); tree(9.5, -13, .85);
// parked car
{ const carM = M(0x8b1e2b, { metalness: .4, roughness: .35 }), tint = M(0x1d2733, { roughness: .2 });
  box(24.6, 30.4, -14.4, -1.8, .8, 3.1, carM, siteG, true); box(25.1, 29.9, -11, -4.6, 3.1, 4.7, tint, siteG, true);
  for (const x of [24.75, 30.25]) for (const z of [-12.4, -3.8]) {
    const w = new THREE.Mesh(new THREE.CylinderGeometry(1.15, 1.15, .7, 20), M(0x111111)); w.rotation.z = Math.PI / 2; w.position.copy(W3(x, 1.15, z)); w.castShadow = true; siteG.add(w); } }

/* ============ GROUND FLOOR WALLS (from drawing) ============ */
wall(0.4, 0.4, 0.4, 57, 0, 'existing');
wall(0.4, 0.4, 17.8, 0.4, 0, 'existing', [[3, 8, 'w'], [13.6, 16.6, 'd']]);
// only Room-2 and Room-5 open into the new house; old-house rooms connect to each other inside
wall(17.8, 0.4, 17.8, 57, 0, 'existing', [[13.4, 16.4, 'd'], [47.2, 50.2, 'd']]);
[11.8, 27.3, 37.4, 46.4].forEach(z => wall(0.4, z, 17.8, z, 0, 'existing', [[10.5, 13.5, 'd']]));
wall(0.4, 57, 17.8, 57, 0, 'existing', [[13.6, 16.6, 'd']]);
wall(0.4, 57, 0.4, 69.6, 0, 'existing', [], { h: 6 });
wall(0.4, 69.6, 21.9, 69.6, 0, 'existing', [], { h: 6 });
// new house
wall(17.8, 57, 21.9, 57, 0, 'new', [[18.5, 21.3, 'd']]);
wall(17.8, 0.4, 33.6, 0.4, 0, 'new', [[19.5, 22.7, 'd'], [25.8, 32.6, 'w']]);
for (let x = 23.1; x < 25.5; x += .32) box(x, x + .18, -.2, .03, .2, 9.4, WOOD, levels[0]);   // wood-slat cladding at entry
wall(33.6, 0.4, 33.6, 69.6, 0, 'new', [[4, 9, 'w'], [30.5, 35.5, 'w'], [42.5, 46.5, 'w'], [54, 60, 'w'], [66.3, 68.3, 'h']]);
wall(21.9, 69.6, 33.6, 69.6, 0, 'new', [[26, 29, 'h']]);
wall(21.9, 50.2, 21.9, 69.6, 0, 'new', [[50.8, 53.6, 'd'], [59, 63, 'w'], [66.5, 68.5, 'h']]);
wall(21.9, 65, 33.6, 65, 0, 'new', [[23.4, 26.2, 'd']]);
wall(21.9, 50.2, 33.6, 50.2, 0, 'new');
wall(22, 39.4, 33.6, 39.4, 0, 'new');
wall(22, 26.8, 22, 39.4, 0, 'new', [[27.4, 30.2, 'd']]);
wall(22, 26.8, 33.6, 26.8, 0, 'new');
wall(24.1, 22.4, 24.1, 26.8, 0, 'new', [[23.1, 25.9, 'd']]);
wall(24.1, 22.4, 33.6, 22.4, 0, 'new');
wall(24.4, 13.1, 33.6, 13.1, 0, 'new', [], { t: .4 });

/* ============ STAIRS (connection, dog-leg, walkable) ============ */

const inR = (x, z, x1, x2, z1, z2) => x >= x1 && x <= x2 && z >= z1 && z <= z2;
function surfaces(x, z) {

  const stair = x > 24.6 && x < 33.6 && z > 13.2 && z < 22.2;
  if (!stair) {
    if (inR(x, z, 0, 34, 0, 57.4) || inR(x, z, 21.5, 34, 57.4, 70) || inR(x, z, 0, 34, -5.2, 0)) s.push(10); // 1st floor, terraces, balcony
    if (inR(x, z, 0, 34, 0, 50.4)) s.push(20);                                                            // roof
  }

    if (x > 30.8) s.push(b + 5);
    else if (z >= 17.7) s.push(b + 5 * (x - 24.6) / 6.2);
    else s.push(b + 5 + 5 * (30.8 - x) / 6.2);
  }

}

}

}

}

function updateWalk(dt) {

</script>
